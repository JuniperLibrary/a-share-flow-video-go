version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - TZ=Asia/Shanghai
      - CORS_ALLOWED_ORIGINS=
    volumes:
      - a-share-flow-data:/app/data
      - a-share-flow-output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/api/dates"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../a-share-flow-video-web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  a-share-flow-data:
  a-share-flow-output:
